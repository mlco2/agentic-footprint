name: CI

on:
  push:
    branches: [main, poc-iteration-1]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run gen:types:check
      - run: npm run lint:hex
      - run: npm run lint:arith
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: console/dist

  # Separate from `console` and NOT a dependency of the cargo jobs below —
  # an e2e flake must never block the Rust workstream (existing CI-coupling
  # friction the final reviewer flagged; this job adds no more of it).
  # Reuses the `console` job's already-built `dist` artifact instead of
  # rebuilding: playwright.config.ts's `webServer` only runs `vite preview`,
  # never `vite build`, specifically so this doesn't pay for a second build.
  console-e2e:
    needs: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: console/dist
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test

  test:
    needs: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.1
      # af-console embeds console/dist at compile time (crates/af-console/build.rs);
      # download the console job's build so cargo test exercises the real
      # bundle instead of the "not built" placeholder.
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: console/dist
      - run: cargo fmt --check
      # --all-targets so tests, benches and examples are linted too: most of
      # the crate's surface lives in integration tests.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify default release surface excludes OpenCode
        run: |
          cargo run --locked -q -p af-cli -- setup --help > /tmp/af-setup-help
          ! grep -qi opencode /tmp/af-setup-help
      - run: cargo test -p af-cli --features experimental-opencode
      - name: claude-code hook collector tests
        run: collectors/claude-code/test_hooks.sh
      - name: statusline bar tests
        run: statusline/test_statusline.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen --group test pytest python/tests -q

  docs-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: scripts/check-repository-hygiene.sh
      - run: scripts/docs.sh build

  test-platforms:
    needs: console
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      # The embedded shell hook and golden strings are byte-exact contracts;
      # disable Windows checkout's default CRLF rewriting before checkout.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: console/dist
      # Ubuntu owns formatting and clippy. This matrix exercises runtime and
      # filesystem behavior on the native macOS and Windows targets.
      - run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen --group test pytest python/tests -q
      - name: macOS collector and statusline tests
        if: runner.os == 'macOS'
        run: |
          collectors/claude-code/test_hooks.sh
          statusline/test_statusline.sh
      - name: macOS installer test
        if: runner.os == 'macOS'
        run: scripts/test-install.sh
      - name: Build the Windows release binary
        if: runner.os == 'Windows'
        run: cargo build --release -p af-cli
      - name: Windows installer test
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1
