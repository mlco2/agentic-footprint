name: CI

on:
  push:
    branches: [main, poc-iteration-1]
  pull_request:

# Read-only unless a job says otherwise.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # cargo-audit itself rather than a third-party action wrapping it:
      # one less publisher to trust, and no checks: write token.
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit

  # CI/CD security gate (getplumber.io): pinned actions, token scopes,
  # credential persistence, untrusted triggers, branch protection. The gate
  # sits at 90 points because `main` still allows force pushes (-10); raise
  # it to 100 once branch protection forbids them. No score is published
  # (score-push stays off); SARIF goes to code scanning on pushes only, as
  # a fork PR's token cannot write security events.
  plumber:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: getplumber/plumber@d3536bae4727b9290d9e69ee25c4350ddbcd91cd # v0.6.0
        with:
          version: v0.6.0
          min-points: '90'
          upload-sarif: ${{ github.event_name == 'push' }}

  # The console and Python locks get the advisory check the Rust lock has.
  # The Python runtime af provisions resolves at install time from the
  # manifest floors, so this covers the pinned versions, not every install.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm advisories (console lock)
        working-directory: console
        run: npm audit --audit-level=moderate
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Python advisories (uv lock, hashed)
        run: |
          uv export --frozen --group test --group runtime --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --require-hashes \
            -r "$RUNNER_TEMP/requirements.txt"

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run gen:types:check
      - run: npm run lint:hex
      - run: npm run lint:arith
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-dist
          path: console/dist

  # Separate from `console` and NOT a dependency of the cargo jobs below —
  # an e2e flake must never block the Rust workstream (existing CI-coupling
  # friction the final reviewer flagged; this job adds no more of it).
  # Reuses the `console` job's already-built `dist` artifact instead of
  # rebuilding: playwright.config.ts's `webServer` only runs `vite preview`,
  # never `vite build`, specifically so this doesn't pay for a second build.
  console-e2e:
    needs: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: console-dist
          path: console/dist
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test

  test:
    needs: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.1
      # af-console embeds console/dist at compile time (crates/af-console/build.rs);
      # download the console job's build so cargo test exercises the real
      # bundle instead of the "not built" placeholder.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: console-dist
          path: console/dist
      - run: cargo fmt --check
      # --all-targets so tests, benches and examples are linted too: most of
      # the crate's surface lives in integration tests.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify default release surface excludes OpenCode
        run: |
          cargo run --locked -q -p af-cli -- setup --help > /tmp/af-setup-help
          ! grep -qi opencode /tmp/af-setup-help
      - run: cargo test -p af-cli --features experimental-opencode
      - name: claude-code hook collector tests
        run: collectors/claude-code/test_hooks.sh
      - name: statusline bar tests
        run: statusline/test_statusline.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      # The runtime group installs the pinned ecologits/codecarbon, so the
      # estimator and model-coverage tests run instead of skipping.
      - run: uv run --frozen --group test --group runtime pytest python/tests -q
        env:
          AF_REQUIRE_ECOLOGITS: '1'

  docs-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: scripts/check-repository-hygiene.sh
      - run: scripts/docs.sh build

  test-platforms:
    needs: console
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      # The embedded shell hook and golden strings are byte-exact contracts;
      # disable Windows checkout's default CRLF rewriting before checkout.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf input
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: console-dist
          path: console/dist
      # Ubuntu owns formatting and clippy. This matrix exercises runtime and
      # filesystem behavior on the native macOS and Windows targets.
      - run: cargo test --workspace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      # The runtime group installs the pinned ecologits/codecarbon, so the
      # estimator and model-coverage tests run instead of skipping.
      - run: uv run --frozen --group test --group runtime pytest python/tests -q
        env:
          AF_REQUIRE_ECOLOGITS: '1'
      - name: macOS collector and statusline tests
        if: runner.os == 'macOS'
        run: |
          collectors/claude-code/test_hooks.sh
          statusline/test_statusline.sh
      - name: macOS installer test
        if: runner.os == 'macOS'
        run: scripts/test-install.sh
      - name: Build the Windows release binary
        if: runner.os == 'Windows'
        run: cargo build --release -p af-cli
      - name: Windows installer test
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1
