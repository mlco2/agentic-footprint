[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
readme = "README.md"
rust-version = "1.97"
repository = "https://github.com/mlco2/agentic-footprint"
homepage = "https://github.com/mlco2/agentic-footprint"

[workspace.metadata.dependency-policy]
# Dependency automation must wait at least seven days after a package release.
minimum-release-age-days = 7

[workspace.dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
anyhow = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

# No `panic = "abort"`: the debug server isolates panicking requests with
# `catch_unwind` (af-cli/src/cmd/debug_server.rs), which abort would defeat.
[profile.release]
strip = "symbols"
opt-level = "z"
lto = "fat"
codegen-units = 1
