[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
readme = "README.md"
rust-version = "1.97"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
