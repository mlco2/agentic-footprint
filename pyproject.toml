[project]
name = "agentic-footprint-tests"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
test = [
  "pytest==9.1.1",
]
# Mirrors [packages] in python/manifest.toml (the pins `afoot` provisions);
# python/tests/test_model_coverage.py fails if the two drift apart.
runtime = [
  "codecarbon==3.3.1",
  "ecologits==0.11.2",
  "psutil>=6",
  # [minimums] in python/manifest.toml.
  "certifi>=2026.10.18",
  "joserfc>=1.7.6",
]

[tool.uv]
package = false

[tool.agentic-footprint.dependency-policy]
# Dependency automation must wait at least seven days after a package release.
minimum-release-age-days = 7
