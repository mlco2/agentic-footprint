# Pins for the managed Python venv that `af-sidecar` provisions via `uv`.
#
# `crates/af-sidecar` embeds this file at compile time (`include_str!`) so
# the `af` binary is self-contained — no external file lookup at runtime.
# These are floors: the versions this binary is tested with. `af python
# upgrade` (run by `af self update`) installs newer releases outside the
# 7-day cooldown above them; nothing is ever installed below them. Sidecar protocol and provisioning
# are owned by the Rust control plane and documented in
# docs/contributing/api-boundaries.md.

[python]
version = "3.12"

[packages]
ecologits = "0.11.2"
codecarbon = "3.3.1"
psutil = ">=6"
