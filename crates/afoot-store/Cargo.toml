[package]
name = "afoot-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SQLite persistence for Agentic Footprint"

[dependencies]
afoot-events = { path = "../afoot-events" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
afoot-events = { path = "../afoot-events", features = ["test-support"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"
