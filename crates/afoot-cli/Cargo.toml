[package]
name = "afoot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Environmental impact measurement and attribution for coding agents"

[features]
default = []

[[bin]]
name = "afoot"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
time = { workspace = true, features = ["local-offset"] }
ureq = "2.12"
# Release signatures, verified in-process: no cosign to install. Pinned
# exactly — the crate is pre-1.0 and its API moves between releases.
sigstore-verify = { version = "=0.14.0", default-features = false }
afoot-console = { path = "../afoot-console" }
afoot-core = { path = "../afoot-core" }
afoot-events = { path = "../afoot-events" }
afoot-otlp = { path = "../afoot-otlp" }
afoot-sidecar = { path = "../afoot-sidecar" }
afoot-spool = { path = "../afoot-spool" }
afoot-store = { path = "../afoot-store" }
notify = "6"
tiny_http = "0.12"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
afoot-events = { path = "../afoot-events", features = ["test-support"] }
assert_cmd = "2.0"
jsonschema = { version = "0.49", default-features = false }
predicates = "3.0"
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
