[package]
name = "af-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Environmental impact measurement and attribution for coding agents"

[features]
default = []
experimental-opencode = ["dep:ureq", "dep:sha2"]

[[bin]]
name = "af"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", optional = true }
time.workspace = true
ureq = { version = "2.12", optional = true }
af-console = { path = "../af-console" }
af-core = { path = "../af-core" }
af-events = { path = "../af-events" }
af-otlp = { path = "../af-otlp" }
af-sidecar = { path = "../af-sidecar" }
af-spool = { path = "../af-spool" }
af-store = { path = "../af-store" }
notify = "6"
tiny_http = "0.12"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
assert_cmd = "2.0"
jsonschema = { version = "0.49", default-features = false }
predicates = "3.0"
tempfile = "3"
