[package]
name = "af-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Environmental impact measurement and attribution for coding agents"

[features]
default = []
experimental-opencode = []

[[bin]]
name = "af"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
time.workspace = true
ureq = "2.12"
af-console = { path = "../af-console" }
af-core = { path = "../af-core" }
af-events = { path = "../af-events" }
af-otlp = { path = "../af-otlp" }
af-sidecar = { path = "../af-sidecar" }
af-spool = { path = "../af-spool" }
af-store = { path = "../af-store" }
notify = "6"
signal-hook = { version = "0.3", default-features = false }
tiny_http = "0.12"

[dev-dependencies]
assert_cmd = "2.0"
jsonschema = { version = "0.49", default-features = false }
predicates = "3.0"
tempfile = "3"
