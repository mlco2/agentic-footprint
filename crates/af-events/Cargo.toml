[package]
name = "af-events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Versioned event contracts for Agentic Footprint"

[features]
# Exposes `af_events::fixtures`, the shared Contract #1 sample values used
# by this crate's and downstream crates' tests. Never enabled by the
# binary's dependency graph — only via `dev-dependencies`.
test-support = []

[dependencies]
jsonschema = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time.workspace = true

[dev-dependencies]
# Self-dependency so this crate's own integration tests (which link the
# library as an external crate) can reach `fixtures`.
af-events = { path = ".", features = ["test-support"] }
