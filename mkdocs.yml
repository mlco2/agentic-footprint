site_name: Agentic Footprint
site_description: Measure and attribute the environmental impact of coding agents.
site_url: https://mlco2.github.io/agentic-footprint/
repo_url: https://github.com/mlco2/agentic-footprint
repo_name: mlco2/agentic-footprint
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: "Agentic Footprint contributors"

theme:
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get Started:
      - Quickstart: get-started/quickstart.md
      - Install and configure: get-started/installation.md
      - Uninstall: get-started/uninstall.md
  - Agents:
      - Claude Code: agents/claude-code.md
      - Codex: agents/codex.md
      - OpenCode: agents/opencode.md
      - Pi: agents/pi.md
  - Guides:
      - Debug console: guides/debug-console.md
      - Programmatic integration: guides/integrate.md
      - Verify releases: guides/verify-release.md
  - Reference:
      - CLI: reference/cli.md
      - Machine-readable output: reference/machine-readable-output.md
      - Debug API: reference/debug-api.md
      - Event schemas: reference/event-schemas.md
      - Known limitations: reference/known-limitations.md
  - Contributing:
      - Developer guide: contributing/developer-guide.md
      - Architecture:
          - Energy attribution: contributing/architecture/energy-attribution.md
          - Rebuild architecture: contributing/architecture/rebuild-architecture.md
          - API boundaries: contributing/architecture/api-boundaries.md
          - Error handling: contributing/architecture/error-handling.md
      - Live tests: contributing/testing-live.md
      - Release process: contributing/release-process.md
